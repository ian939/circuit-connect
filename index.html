<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>전류 잇기 · 충전 대기 미니게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12112A; --panel:#1E1D3D; --slot:#26254A; --line:#302F58;
    --cyan:#41E6E0; --cyan-dim:#2CB6B2; --amber:#FFB84D;
    --ink:#ECECFF; --muted:#8785BE; --muted2:#5F5D95;
  }
  /* 태블릿에서 길게 누를 때 뜨는 "복사/잘라내기" 콜아웃과 텍스트 선택을 전부 차단 */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #201E44 0%, var(--bg) 55%, #0D0C20 100%);
    color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;
    display:flex;justify-content:center;align-items:flex-start;
    min-height:100dvh;padding:16px 14px 30px;overflow-x:hidden;
    touch-action:manipulation;overscroll-behavior:none;
  }
  .app{width:100%;max-width:440px;}

  .brand{display:flex;align-items:center;gap:10px;margin:2px 2px 14px;}
  .plug{width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(145deg,#2A2A55,#15142E);border:1px solid var(--line);
    display:grid;place-items:center;box-shadow:0 0 0 1px #0004,0 6px 16px #0006;}
  .plug svg{width:19px;height:19px;}
  .brand h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1;}
  .brand .sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-family:"IBM Plex Mono",monospace;}

  .readout{background:linear-gradient(180deg,var(--panel),#171633);border:1px solid var(--line);
    border-radius:16px;padding:13px 15px 15px;margin-bottom:12px;
    box-shadow:inset 0 1px 0 #ffffff10,0 8px 22px #0005;}
  .meter-top{display:flex;justify-content:space-between;align-items:baseline;font-family:"IBM Plex Mono",monospace;}
  .meter-top .lab{font-size:10.5px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;}
  .meter-top .goal{font-size:13px;color:var(--cyan);font-weight:600;}
  .meter-top .goal b{color:var(--ink);}
  .bar{height:12px;border-radius:8px;background:var(--slot);margin-top:9px;overflow:hidden;border:1px solid #00000030;}
  .bar>i{display:block;height:100%;width:0%;border-radius:8px;
    background:linear-gradient(90deg,var(--cyan-dim),var(--cyan) 70%,#B9FFFB);
    box-shadow:0 0 14px var(--cyan);transition:width .3s cubic-bezier(.2,.7,.2,1);}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
  .stat{background:#00000026;border:1px solid #ffffff0d;border-radius:11px;padding:8px 9px;}
  .stat .k{font-size:9.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-family:"IBM Plex Mono",monospace;}
  .stat .v{font-size:19px;font-weight:700;margin-top:2px;font-family:"IBM Plex Mono",monospace;line-height:1;}
  .stat.pt .v{color:var(--amber);}
  .stat.pt .v small{font-size:11px;font-weight:600;}

  .board-wrap{position:relative;}
  .board{position:relative;width:100%;aspect-ratio:1/1;display:grid;gap:5px;padding:8px;
    background:linear-gradient(180deg,#201F42,#16152E);border:1px solid var(--line);border-radius:20px;
    touch-action:none;user-select:none;box-shadow:inset 0 2px 10px #0006,0 14px 40px #0007;}
  .cell{position:relative;border-radius:9px;background:#22214333;box-shadow:inset 0 0 0 1px #ffffff08;}
  .core{position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:4px;z-index:2;}
  .core.done{filter:brightness(1.15);}
  .arm{position:absolute;z-index:1;}
  .arm.u{left:35%;top:0;width:30%;height:52%;}
  .arm.d{left:35%;top:48%;width:30%;height:52%;}
  .arm.l{left:0;top:35%;width:52%;height:30%;}
  .arm.r{left:48%;top:35%;width:52%;height:30%;}
  .term{position:absolute;left:15%;top:15%;width:70%;height:70%;border-radius:50%;z-index:3;
    box-shadow:inset 0 2px 5px #00000055,0 0 0 3px #ffffff14;}
  .term.done{animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}

  .controls{display:flex;gap:9px;margin-top:14px;}
  .btn{flex:1;border:1px solid var(--line);border-radius:13px;
    background:linear-gradient(180deg,#242348,#1A1936);color:var(--ink);
    font-family:inherit;font-size:14px;font-weight:600;padding:12px;cursor:pointer;
    transition:transform .08s,border-color .15s;}
  .btn:hover{border-color:var(--cyan-dim);}
  .btn:active{transform:scale(.97);}
  .btn svg{vertical-align:-3px;margin-right:6px;width:15px;height:15px;}
  .hint{text-align:center;color:var(--muted2);font-size:11.5px;margin-top:11px;
    font-family:"IBM Plex Mono",monospace;letter-spacing:.03em;}

  .overlay{position:absolute;inset:0;border-radius:20px;background:rgba(12,11,30,.82);
    backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:22px;z-index:10;}
  .overlay.show{display:flex;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .overlay .big{font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-family:"IBM Plex Mono",monospace;}
  .overlay .headline{font-size:32px;font-weight:700;margin:8px 0 4px;letter-spacing:-.02em;}
  .overlay .reward{margin:14px 0 6px;font-family:"IBM Plex Mono",monospace;font-size:40px;font-weight:700;
    color:var(--amber);text-shadow:0 0 26px #FFB84D66;}
  .overlay .reward .p{font-size:20px;}
  .overlay .desc{color:var(--muted);font-size:13px;max-width:250px;line-height:1.5;margin-bottom:20px;}
  .overlay .o-btns{display:flex;gap:10px;width:100%;max-width:300px;}
  .overlay .btn.primary{background:linear-gradient(180deg,var(--cyan),var(--cyan-dim));color:#062322;
    border-color:transparent;font-weight:700;box-shadow:0 8px 22px #41E6E055;}
  /* ---------- 탭 / 뷰 ---------- */
  .tabs{display:flex;gap:5px;background:#00000033;border:1px solid var(--line);
    border-radius:14px;padding:4px;margin-bottom:12px;}
  .tab{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;
    font-size:13px;font-weight:600;padding:9px 6px;border-radius:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:5px;transition:background .15s,color .15s;}
  .tab.active{background:linear-gradient(180deg,#2E2D5C,#232246);color:var(--ink);box-shadow:0 2px 8px #0004;}
  .tab .lock{font-size:11px;opacity:.85;}
  .tab .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);}
  .view{display:none;}
  .view.on{display:block;}

  /* ---------- 챌린지 로비 ---------- */
  .controls.solo #newp{display:none;}          /* 챌린지엔 '새 판' 없음 — 타이머 리셋 어뷰징 차단 */

  /* ---------- 적립 현황 ---------- */
  .wallet{display:flex;justify-content:space-between;align-items:flex-end;
    background:linear-gradient(180deg,#2A2952,#1B1A38);border:1px solid var(--line);
    border-radius:16px;padding:13px 15px;margin-bottom:9px;
    box-shadow:inset 0 1px 0 #ffffff10,0 6px 18px #0004;}
  .wallet .wk{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
    color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px;}
  .wallet .wv{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:700;
    color:var(--amber);line-height:1;text-shadow:0 0 20px #FFB84D44;}
  .wallet .wv small{font-size:13px;}
  .wallet .wmax{font-size:12px;color:var(--muted2);font-weight:500;text-shadow:none;}
  .wallet .wr{text-align:right;}
  .wallet .wv2{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:700;color:var(--ink);}
  .wallet .wv2 small{font-size:11px;color:var(--muted);}

  .quota{display:flex;align-items:center;gap:6px;margin:0 4px 12px;
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted2);letter-spacing:.06em;}
  .quota i{width:22px;height:5px;border-radius:3px;background:var(--slot);display:block;}
  .quota i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
  .quota span{margin-left:4px;}

  .alldone{background:#41E6E00f;border:1px solid #41E6E033;border-radius:14px;
    padding:13px;text-align:center;font-size:12.5px;color:var(--ink);margin-bottom:10px;line-height:1.6;}
  .alldone b{color:var(--amber);font-family:"IBM Plex Mono",monospace;}
  .alldone span{color:var(--muted);font-size:11.5px;}

  .lobby-head{display:flex;justify-content:space-between;align-items:baseline;
    margin:2px 3px 11px;font-family:"IBM Plex Mono",monospace;}
  .lobby-head .d{font-size:13px;color:var(--cyan);font-weight:600;letter-spacing:.07em;}
  .lobby-head .r{font-size:9.5px;color:var(--muted2);letter-spacing:.13em;text-transform:uppercase;}

  .ch-card{width:100%;text-align:left;display:grid;grid-template-columns:46px 1fr auto;
    align-items:center;gap:12px;background:linear-gradient(180deg,var(--panel),#171633);
    border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;
    color:var(--ink);font-family:inherit;cursor:pointer;
    box-shadow:inset 0 1px 0 #ffffff10,0 6px 18px #0004;transition:transform .08s,border-color .15s;}
  .ch-card:hover{border-color:var(--cyan-dim);}
  .ch-card:active{transform:scale(.985);}
  .ch-card .no{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
    background:#00000038;border:1px solid #ffffff0f;font-family:"IBM Plex Mono",monospace;
    font-size:18px;font-weight:700;color:var(--cyan);}
  .ch-card.cleared .no{color:#062322;border-color:transparent;
    background:linear-gradient(180deg,var(--cyan),var(--cyan-dim));box-shadow:0 0 16px #41E6E055;}
  .ch-card .nm,.ch-card .mt,.ch-card .rc{display:block;}
  .ch-card .nm{font-size:15px;font-weight:700;letter-spacing:-.01em;}
  .ch-card .mt{font-size:10.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;
    margin-top:3px;letter-spacing:.06em;}
  .ch-card .rc{font-size:11.5px;font-family:"IBM Plex Mono",monospace;margin-top:5px;color:var(--muted2);}
  .ch-card .rc b{color:var(--cyan);font-weight:600;}
  .ch-card .rc i{color:var(--amber);font-style:normal;font-weight:700;}
  .ch-card .rc u{color:var(--amber);text-decoration:none;font-weight:600;}
  .ch-card .rc s{color:var(--muted2);text-decoration:none;}
  .ch-card.cleared{opacity:.72;}
  .ch-card.prog{border-color:#FFB84D66;}
  .ch-card.prog .no{color:var(--amber);border-color:#FFB84D44;}
  .ch-card .go{font-size:17px;color:var(--muted2);padding-right:2px;}

  .locked{background:linear-gradient(180deg,var(--panel),#171633);border:1px dashed var(--line);
    border-radius:18px;padding:30px 22px;text-align:center;}
  .locked .ico{font-size:32px;line-height:1;}
  .locked h3{margin:12px 0 6px;font-size:17px;font-weight:700;}
  .locked p{color:var(--muted);font-size:12.5px;line-height:1.65;margin:0 0 18px;}
  .locked .lbar{height:10px;border-radius:6px;background:var(--slot);overflow:hidden;border:1px solid #00000030;}
  .locked .lbar>i{display:block;height:100%;border-radius:6px;
    background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));box-shadow:0 0 12px var(--cyan);
    transition:width .4s cubic-bezier(.2,.7,.2,1);}
  .locked .lnum{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--cyan);margin-top:9px;}

  /* ---------- 챌린지 플레이 헤더 ---------- */
  .playbar{display:none;align-items:center;gap:10px;margin:0 2px 11px;}
  .playbar.on{display:flex;}
  .playbar .back{border:1px solid var(--line);background:#00000030;color:var(--ink);
    border-radius:10px;padding:7px 11px;font-family:inherit;font-size:12.5px;font-weight:600;
    cursor:pointer;transition:transform .08s;}
  .playbar .back:active{transform:scale(.96);}
  .playbar .t{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
    letter-spacing:.13em;text-transform:uppercase;}

  /* ---------- 랭킹 시트 ---------- */
  .sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;
    background:rgba(7,6,21,.66);backdrop-filter:blur(5px);}
  .sheet.show{display:flex;animation:fade .2s ease;}
  .sheet-in{width:100%;max-width:440px;background:linear-gradient(180deg,#242349,#15142E);
    border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
    padding:16px 15px calc(20px + env(safe-area-inset-bottom));
    max-height:88dvh;overflow:auto;animation:up .26s cubic-bezier(.2,.8,.2,1);}
  @keyframes up{from{transform:translateY(28px);opacity:.4;}to{transform:none;opacity:1;}}
  .sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 14px;}
  .sheet h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;}
  .sheet .sub2{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);
    letter-spacing:.15em;text-transform:uppercase;margin:5px 0 14px;}
  .rswitch{display:flex;gap:5px;background:#00000033;border:1px solid var(--line);
    border-radius:12px;padding:4px;margin:0 0 13px;}
  .rswitch button{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;
    font-size:12px;font-weight:600;padding:8px 4px;border-radius:9px;cursor:pointer;}
  .rswitch button.on{background:linear-gradient(180deg,#2E2D5C,#232246);color:var(--ink);}
  .rank{list-style:none;margin:0;padding:0;}
  .rank li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;
    padding:10px 12px;border-radius:12px;background:#00000026;border:1px solid #ffffff0a;margin-bottom:6px;}
  .rank li.me{background:linear-gradient(90deg,#41E6E024,#41E6E00a);border-color:#41E6E055;}
  .rank .p{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:700;
    color:var(--muted2);text-align:center;}
  .rank .p.g1{color:#FFD86B;} .rank .p.g2{color:#CFD6E8;} .rank .p.g3{color:#E0975C;}
  .rank .nm2{font-size:14px;font-weight:600;}
  .rank li.me .nm2:after{content:'YOU';font-family:"IBM Plex Mono",monospace;font-size:9px;
    background:var(--cyan);color:#062322;border-radius:5px;padding:2px 5px;margin-left:7px;
    vertical-align:1.5px;font-weight:700;letter-spacing:.05em;}
  .rank .tm{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;color:var(--cyan);}
  .rank .tm.non{color:var(--muted2);}
  .sheet .btn{width:100%;margin-top:13px;}

  .stat .v.sm{font-size:16px;}

  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="plug">
      <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke="#41E6E0" stroke-width="1.7" stroke-linejoin="round"/></svg>
    </div>
    <div><h1>전류 잇기</h1><div class="sub">Connect · Fill · Charge</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-onboard">온보딩</button>
    <button class="tab" id="tab-challenge">데일리 챌린지 <span class="lock" id="tab-lock">🔒</span></button>
  </div>

  <!-- ===================== 챌린지 로비 ===================== -->
  <div class="view" id="view-lobby">
    <div class="lobby-head">
      <span class="d" id="ch-date">—</span>
      <span class="r">매일 자정 초기화</span>
    </div>
    <div id="ch-list"></div>
  </div>

  <!-- ===================== 게임 보드 ===================== -->
  <div class="view on" id="view-game">
  <div class="playbar" id="playbar">
    <button class="back" id="back">← 목록</button>
    <span class="t" id="play-title"></span>
  </div>

  <div class="readout">
    <div class="meter-top">
      <span class="lab">회로 완성도</span>
      <span class="goal"><b id="conn">0</b> / <span id="total">0</span> 회로 연결</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="stats">
      <div class="stat"><div class="k" id="k1">Stage</div><div class="v" id="stage">1</div></div>
      <div class="stat"><div class="k">채움</div><div class="v" id="fill">0<small style="font-size:11px">%</small></div></div>
      <div class="stat pt"><div class="k" id="k3">적립 충전금</div><div class="v" id="points">0<small>원</small></div></div>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board">
      <div class="overlay" id="overlay">
        <div class="big">회로 완성</div>
        <div class="headline" id="o-head">STAGE 1 CLEAR</div>
        <div class="reward" id="o-reward">+60<span class="p">P</span></div>
        <div class="desc" id="o-desc">모든 회로가 연결됐어요. 충전 포인트가 적립됐습니다.</div>
        <div class="o-btns">
          <button class="btn" id="o-restart">처음부터</button>
          <button class="btn primary" id="o-next">다음 스테이지</button>
        </div>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="btn" id="clear">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      지우기
    </button>
    <button class="btn" id="newp">
      <svg viewBox="0 0 24 24" fill="none"><path d="M20 11a8 8 0 1 0-.9 4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M20 4v5h-5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      새 판
    </button>
  </div>
  <div class="hint" id="hint">같은 색 단자를 드래그해서 잇기 · 빈칸을 모두 채우면 완성</div>
  </div><!-- /view-game -->
</div>

<!-- ===================== 랭킹 시트 ===================== -->
<div class="sheet" id="sheet">
  <div class="sheet-in">
    <div class="grab"></div>
    <h3 id="rank-title">랭킹</h3>
    <div class="sub2" id="rank-sub">FASTEST TIME</div>
    <div class="rswitch" id="rank-switch"></div>
    <ol class="rank" id="rank-list"></ol>
    <button class="btn" id="sheet-close">닫기</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  const PAL=['#41E6E0','#FFB020','#FF4D8D','#4ED964','#9B7BFF','#FF7A3D','#4D8BFF','#FF5252'];
  const board=document.getElementById('board');

  let W,H,N, cellColor, endpointOf, colorPaths, colorDone, numColors;
  let cellEls=[], stage=1;
  let drawing=false, active=-1;

  /* ================= 챌린지 설정 ================= */
  const ONBOARD_LEN=10;                       // 온보딩: 10스테이지
  const ME='Ian';                             // 로그인 붙기 전 임시 내 ID
  const NAMES=['Ian','Cristie','Tiffny','John','Morgan','Tommy','Anders','Hazle','Judge','Andy'];
  const CHALLENGES=[
    { name:'워밍업',   size:6, colors:5, base: 52000 },
    { name:'러시아워', size:7, colors:6, base: 96000 },
    { name:'과부하',   size:8, colors:8, base:165000 },
  ];
  const PAY=10;                               // 1판 = 10원 (충전 포인트)
  /* 적립 규칙
     - 온보딩: 각 단계 최초 클리어 1회만 지급 (10단계 = 100원, 반복 파밍 불가)
     - 챌린지: 하루 3판 × 10원 = 30원. 완주하면 그날은 재참여 불가        */

  /* ---------- 시드 난수 : 같은 날 = 같은 문제 = 공정한 랭킹 ---------- */
  function hashStr(s){
    let h=2166136261>>>0;
    for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
    return h>>>0;
  }
  function mulberry32(a){
    return function(){
      a=a+0x6D2B79F5|0;
      let t=Math.imul(a^a>>>15, 1|a);
      t=t+Math.imul(t^t>>>7, 61|t)^t;
      return ((t^t>>>14)>>>0)/4294967296;
    };
  }
  let rnd=Math.random;                        // genPuzzle 이 시드에 따라 교체

  /* ---------- 저장 ---------- */
  const KEY='circuit-connect.v2';
  // paidStage: 여기까지의 온보딩 단계는 이미 적립됨 → '처음부터'로 재클리어해도 재지급 없음
  let store={ maxStage:1, won:0, paidStage:0, unlocked:false, daily:{} };
  try{ const raw=localStorage.getItem(KEY); if(raw) store=Object.assign(store, JSON.parse(raw)||{}); }catch(e){}
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

  function todayKey(){
    const d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function todayRec(){
    const t=todayKey();
    if(!store.daily || typeof store.daily!=='object') store.daily={};
    for(const k of Object.keys(store.daily)) if(k!==t) delete store.daily[k];   // 날짜 바뀌면 초기화
    if(!store.daily[t]) store.daily[t]={};
    return store.daily[t];
  }
  function myBest(ci){ const r=todayRec()[ci]; return (r && r.ms!=null) ? r.ms : null; }
  function doneCount(){ const r=todayRec(); return CHALLENGES.filter((c,i)=>r[i] && r[i].ms!=null).length; }
  function wonToday(){ return doneCount()*PAY; }

  /* ---------- 시간 표기 ---------- */
  function fmt(ms){
    if(ms==null) return '--:--';
    const t=Math.floor(ms/100), s=Math.floor(t/10);
    return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'.'+(t%10);
  }

  /* ---------- 랭킹 : 봇 기록도 날짜 시드라 새로고침해도 그대로 ---------- */
  function botTimes(ci){
    const key=todayKey();
    return NAMES.filter(n=>n!==ME).map(n=>{
      const r=mulberry32(hashStr(key+'|'+ci+'|'+n));
      r(); r();
      return { name:n, ms:Math.round(CHALLENGES[ci].base*(0.52+r()*1.15)) };
    });
  }
  function leaderboard(ci){
    const list=botTimes(ci);
    list.push({ name:ME, ms:myBest(ci), me:true });
    list.sort((a,b)=>{
      if(a.ms==null && b.ms==null) return 0;
      if(a.ms==null) return 1;
      if(b.ms==null) return -1;
      return a.ms-b.ms;
    });
    return list;
  }
  function myRank(ci){ return leaderboard(ci).findIndex(x=>x.me)+1; }

  /* ---------- 레벨 생성기 : 항상 정답이 존재 (해밀턴 경로를 잘라 색 배정) ---------- */
  function neighbors(cell){
    const r=(cell/W)|0, c=cell%W, out=[];
    if(r>0) out.push(cell-W); if(r<H-1) out.push(cell+W);
    if(c>0) out.push(cell-1); if(c<W-1) out.push(cell+1);
    return out;
  }
  function genPuzzle(size,colors,seed){
    rnd = (seed==null) ? Math.random : mulberry32(seed>>>0);
    W=H=size; N=W*H;
    // 1) 지그재그 해밀턴 경로
    let path=[];
    for(let r=0;r<H;r++){
      if(r%2===0) for(let c=0;c<W;c++) path.push(r*W+c);
      else for(let c=W-1;c>=0;c--) path.push(r*W+c);
    }
    // 2) backbite 로 무작위화 (해밀턴 유지)
    const posIdx=new Int32Array(N);
    for(let i=0;i<N;i++) posIdx[path[i]]=i;
    const iters=N*22;
    for(let it=0;it<iters;it++){
      if(rnd()<0.5){ path.reverse(); for(let i=0;i<N;i++) posIdx[path[i]]=i; }
      const u=path[N-1], nb=neighbors(u);
      const w=nb[(rnd()*nb.length)|0];
      if(w===path[N-2]) continue;
      const i=posIdx[w];
      let lo=i+1, hi=N-1;
      while(lo<hi){ const t=path[lo];path[lo]=path[hi];path[hi]=t;lo++;hi--; }
      for(let k=i+1;k<N;k++) posIdx[path[k]]=k;
    }
    // 3) 색 개수만큼 조각내기 (각 조각 길이 >= 2)
    numColors=Math.min(colors, PAL.length, Math.floor(N/2));
    const base=Math.floor(N/numColors), rem=N%numColors, sizes=[];
    for(let i=0;i<numColors;i++) sizes.push(base+(i<rem?1:0));
    for(let s=0;s<numColors*3;s++){
      const i=(rnd()*numColors)|0, j=(rnd()*numColors)|0;
      if(i!==j && sizes[i]>2){ sizes[i]--; sizes[j]++; }
    }
    // 4) 상태 초기화 + 단자 배치
    cellColor=new Int32Array(N).fill(-1);
    endpointOf=new Int32Array(N).fill(-1);
    colorPaths=[]; colorDone=[];
    let idx=0;
    for(let ci=0;ci<numColors;ci++){
      const len=sizes[ci];
      endpointOf[path[idx]]=ci;
      endpointOf[path[idx+len-1]]=ci;
      colorPaths.push([]); colorDone.push(false);
      idx+=len;
    }
    buildBoard();
    render(); updateHud();
  }

  function buildBoard(){
    board.style.gridTemplateColumns=`repeat(${W},1fr)`;
    board.style.gridTemplateRows=`repeat(${H},1fr)`;
    // overlay 는 유지, cell 만 재생성
    board.querySelectorAll('.cell').forEach(e=>e.remove());
    cellEls=[];
    for(let i=0;i<N;i++){
      const d=document.createElement('div');
      d.className='cell';
      board.insertBefore(d, document.getElementById('overlay'));
      cellEls.push(d);
    }
  }

  /* ---------- 렌더 ---------- */
  function recomputeDone(){
    for(let k=0;k<numColors;k++){
      const p=colorPaths[k];
      colorDone[k] = p.length>=2 && endpointOf[p[0]]===k && endpointOf[p[p.length-1]]===k && p[0]!==p[p.length-1];
    }
  }
  function render(){
    recomputeDone();
    const conn=Array.from({length:N},()=>'');
    for(let k=0;k<numColors;k++){
      const p=colorPaths[k];
      for(let i=0;i<p.length-1;i++){
        const a=p[i], b=p[i+1], diff=b-a;
        if(diff===1){ conn[a]+='r'; conn[b]+='l'; }
        else if(diff===-1){ conn[a]+='l'; conn[b]+='r'; }
        else if(diff===W){ conn[a]+='d'; conn[b]+='u'; }
        else if(diff===-W){ conn[a]+='u'; conn[b]+='d'; }
      }
    }
    for(let i=0;i<N;i++){
      const el=cellEls[i], col=cellColor[i]; let html='';
      if(col>=0){
        const hex=PAL[col], done=colorDone[col];
        const c=conn[i];
        if(c.includes('u')) html+=`<span class="arm u" style="background:${hex}"></span>`;
        if(c.includes('d')) html+=`<span class="arm d" style="background:${hex}"></span>`;
        if(c.includes('l')) html+=`<span class="arm l" style="background:${hex}"></span>`;
        if(c.includes('r')) html+=`<span class="arm r" style="background:${hex}"></span>`;
        html+=`<span class="core${done?' done':''}" style="background:${hex}${done?';box-shadow:0 0 12px '+hex:''}"></span>`;
      }
      const ep=endpointOf[i];
      if(ep>=0){
        const hex=PAL[ep], done=colorDone[ep];
        html+=`<span class="term${done?' done':''}" style="background:${hex}"></span>`;
      }
      el.innerHTML=html;
    }
  }

  const el=id=>document.getElementById(id);
  function updateHud(){
    recomputeDone();
    let done=0; for(let k=0;k<numColors;k++) if(colorDone[k]) done++;
    let filled=0; for(let i=0;i<N;i++) if(cellColor[i]>=0) filled++;
    el('conn').textContent=done;
    el('total').textContent=numColors;
    el('fill').innerHTML=Math.round(filled/N*100)+'<small style="font-size:11px">%</small>';
    el('bar').style.width=(done/numColors*100)+'%';

    const s1=el('stage'), s3=el('points');
    if(inPlay){                                        // 챌린지 진행 중
      el('k1').textContent='경과 시간';  s1.className='v sm'; s1.textContent=fmt(elapsed());
      el('k3').textContent='내 최고';    s3.className='v sm'; s3.textContent=fmt(myBest(chIndex));
    } else {                                           // 온보딩
      el('k1').textContent='Stage';
      s1.className = stage<=ONBOARD_LEN ? 'v sm' : 'v';
      s1.textContent = stage<=ONBOARD_LEN ? stage+' / '+ONBOARD_LEN : String(stage);
      el('k3').textContent='적립 충전금'; s3.className='v';
      s3.innerHTML=store.won.toLocaleString()+'<small>원</small>';
    }
  }

  /* ---------- 드로잉 로직 ---------- */
  function adjacent(a,b){
    const ra=(a/W)|0, ca=a%W, rb=(b/W)|0, cb=b%W;
    return (ra===rb && Math.abs(ca-cb)===1) || (ca===cb && Math.abs(ra-rb)===1);
  }
  function clearColor(k){ for(const idx of colorPaths[k]) cellColor[idx]=-1; colorPaths[k]=[]; }
  function cutColor(m, atCell){
    const p=colorPaths[m], j=p.indexOf(atCell); if(j<0) return;
    for(let x=j;x<p.length;x++) if(cellColor[p[x]]===m) cellColor[p[x]]=-1;
    colorPaths[m]=p.slice(0,j);
  }
  function startColor(k, epCell){ clearColor(k); colorPaths[k]=[epCell]; cellColor[epCell]=k; }
  function grabPath(k, cell){
    const p=colorPaths[k], j=p.indexOf(cell); if(j<0) return;
    for(let x=j+1;x<p.length;x++) cellColor[p[x]]=-1;
    colorPaths[k]=p.slice(0,j+1);
  }

  function step(target){
    const k=active, p=colorPaths[k], head=p[p.length-1];
    if(target===head || !adjacent(target,head)) return;
    if(p.length>=2 && target===p[p.length-2]){ cellColor[p.pop()]=-1; render(); updateHud(); return; }
    const inIdx=p.indexOf(target);
    if(inIdx>=0){ for(let x=p.length-1;x>inIdx;x--) cellColor[p[x]]=-1; colorPaths[k]=p.slice(0,inIdx+1); render(); return; }
    const tEp=endpointOf[target];
    if(tEp>=0 && tEp!==k) return;                 // 다른 색 단자는 통과 불가
    const tc=cellColor[target];
    if(tc>=0 && tc!==k) cutColor(tc, target);      // 다른 케이블 위를 지나가면 끊김
    cellColor[target]=k; p.push(target);
    render(); updateHud(); checkWin();
  }

  function cellAt(e){
    const rect=board.getBoundingClientRect();
    const x=e.clientX-rect.left, y=e.clientY-rect.top;
    if(x<0||y<0||x>rect.width||y>rect.height) return null;
    const c=Math.min(W-1,Math.max(0,Math.floor(x/(rect.width/W))));
    const r=Math.min(H-1,Math.max(0,Math.floor(y/(rect.height/H))));
    return r*W+c;
  }

  /* 길게 누르기·드래그로 뜨는 선택 메뉴(복사/잘라내기)와 컨텍스트 메뉴 차단.
     오버레이 버튼은 정상 탭돼야 하므로 제외한다. */
  const isBtn=t=>!!(t&&t.closest&&t.closest('button'));
  board.addEventListener('touchstart',e=>{ if(!isBtn(e.target)) e.preventDefault(); },{passive:false});
  board.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('dragstart',e=>e.preventDefault());

  board.addEventListener('pointerdown',e=>{
    if(!isBtn(e.target)) e.preventDefault();
    if(overlay.classList.contains('show')) return;
    const cell=cellAt(e); if(cell==null) return;
    board.setPointerCapture(e.pointerId);
    const ep=endpointOf[cell], col=cellColor[cell];
    if(ep>=0){ active=ep; startColor(ep,cell); drawing=true; }
    else if(col>=0){ active=col; grabPath(col,cell); drawing=true; }
    else return;
    render(); updateHud();
  });
  board.addEventListener('pointermove',e=>{
    if(!drawing) return; e.preventDefault();
    const cell=cellAt(e); if(cell!=null) step(cell);
  },{passive:false});
  window.addEventListener('pointerup',()=>{
    if(drawing) saveProgress();          // 이어서 풀기용 진행 상황 저장
    drawing=false; active=-1;
  });

  /* ================= 모드 / 화면 전환 ================= */
  const overlay=el('overlay');
  let mode='onboard';        // 'onboard' | 'challenge'
  let chIndex=-1;            // 진행 중인 챌린지 번호
  let inPlay=false;          // 챌린지 보드를 실제로 풀고 있는 중
  let onboardSnap=null;      // 탭 이동 시 온보딩 판 보존

  function snapshot(){
    return { W,H,N,numColors, stage,
             cellColor:Int32Array.from(cellColor), endpointOf:Int32Array.from(endpointOf),
             colorPaths:colorPaths.map(p=>p.slice()) };
  }
  function restore(s){
    W=s.W; H=s.H; N=s.N; numColors=s.numColors; stage=s.stage;
    cellColor=Int32Array.from(s.cellColor); endpointOf=Int32Array.from(s.endpointOf);
    colorPaths=s.colorPaths.map(p=>p.slice()); colorDone=new Array(numColors).fill(false);
    buildBoard(); render(); updateHud();
  }

  /* ---------- 타이머 : 판이 열리는 순간부터 카운트 ---------- */
  let chStart=0, chTick=null, chRunning=false, chFinal=0;
  function elapsed(){ return chRunning ? Date.now()-chStart : chFinal; }
  function startTimer(fromTs){               // 이어서 풀기면 최초 입장 시각을 그대로 이어받음
    chStart=fromTs||Date.now(); chFinal=0; chRunning=true;
    clearInterval(chTick); chTick=setInterval(updateHud,100); updateHud();
  }
  function stopTimer(){ if(chRunning) chFinal=Date.now()-chStart; chRunning=false; clearInterval(chTick); chTick=null; }

  /* ---------- 탭 ---------- */
  function renderTabs(){
    el('tab-onboard').classList.toggle('active', mode==='onboard');
    el('tab-challenge').classList.toggle('active', mode==='challenge');
    const lock=el('tab-lock');
    if(!store.unlocked){ lock.className='lock'; lock.textContent='🔒'; }
    else {
      const rec=todayRec(), left=CHALLENGES.filter((c,i)=>!rec[i]).length;
      if(left){ lock.className='dot'; lock.textContent=''; }
      else { lock.className='lock'; lock.textContent='✓'; }
    }
  }
  function showView(v){
    el('view-lobby').classList.toggle('on', v==='lobby');
    el('view-game').classList.toggle('on', v==='game');
  }

  function goOnboard(){
    saveProgress(); stopTimer(); stopLobbyTick();
    mode='onboard'; inPlay=false; chIndex=-1;
    el('playbar').classList.remove('on');
    el('controls').classList.remove('solo');
    el('hint').textContent='같은 색 단자를 드래그해서 잇기 · 빈칸을 모두 채우면 완성';
    showView('game'); renderTabs();
    if(onboardSnap) restore(onboardSnap); else { const p=params(stage); genPuzzle(p.size,p.colors); }
  }
  function goLobby(){
    if(mode==='onboard') onboardSnap=snapshot();
    saveProgress(); stopTimer();               // 나가도 start 시각은 유지 → 타이머 계속
    mode='challenge'; inPlay=false; chIndex=-1;
    el('playbar').classList.remove('on');
    el('controls').classList.remove('solo');
    showView('lobby'); renderTabs(); renderLobby(); startLobbyTick();
  }

  /* ---------- 로비 ---------- */
  let lobbyTick=null;
  function startLobbyTick(){                 // 진행 중인 판의 경과 시간만 갱신
    clearInterval(lobbyTick);
    lobbyTick=setInterval(()=>{
      const rec=todayRec();
      CHALLENGES.forEach((c,i)=>{
        const r=rec[i]; if(!r || r.ms!=null) return;
        const n=el('rc'+i);
        if(n) n.innerHTML='<u>진행 중</u> <b>'+fmt(Date.now()-r.start)+'</b> · 이어서 풀기';
      });
    }, 200);
  }
  function stopLobbyTick(){ clearInterval(lobbyTick); lobbyTick=null; }

  function renderLobby(){
    const d=new Date();
    el('ch-date').textContent=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
    const list=el('ch-list');

    if(!store.unlocked){
      const cur=Math.min(store.maxStage, ONBOARD_LEN);
      list.innerHTML=
        '<div class="locked">'+
          '<div class="ico">🔒</div>'+
          '<h3>온보딩 '+ONBOARD_LEN+'단계를 먼저 통과하세요</h3>'+
          '<p>온보딩을 끝내면 매일 3판이 열립니다.<br>1판당 <b style="color:#FFB84D">'+PAY+'원</b>씩 충전 포인트로 적립돼요.</p>'+
          '<div class="lbar"><i style="width:'+(cur/ONBOARD_LEN*100)+'%"></i></div>'+
          '<div class="lnum">'+cur+' / '+ONBOARD_LEN+' 단계</div>'+
        '</div>';
      return;
    }

    const rec=todayRec(), nDone=doneCount(), allDone=nDone===CHALLENGES.length;

    let html=
      '<div class="wallet">'+
        '<div><span class="wk">오늘 적립</span>'+
          '<span class="wv">'+wonToday()+'<small>원</small>'+
          '<span class="wmax"> / '+(CHALLENGES.length*PAY)+'원</span></span></div>'+
        '<div class="wr"><span class="wk">누적</span>'+
          '<span class="wv2">'+store.won.toLocaleString()+'<small>원</small></span></div>'+
      '</div>'+
      '<div class="quota">'+
        CHALLENGES.map((c,i)=>'<i class="'+((rec[i]&&rec[i].ms!=null)?'on':'')+'"></i>').join('')+
        '<span>오늘 '+nDone+' / '+CHALLENGES.length+'판 완료</span>'+
      '</div>';

    html+=CHALLENGES.map((c,i)=>{
      const r=rec[i];
      const done   = !!(r && r.ms!=null);
      const inProg = !!(r && r.ms==null);
      const info = done   ? '내 기록 <b>'+fmt(r.ms)+'</b> · <i>'+myRank(i)+'위</i> · <s>+'+PAY+'원 적립됨</s>'
                 : inProg ? '<u>진행 중</u> <b>'+fmt(Date.now()-r.start)+'</b> · 이어서 풀기'
                 : '미도전 · 열면 바로 시간 카운트 · +'+PAY+'원';
      return '<button class="ch-card'+(done?' cleared':'')+(inProg?' prog':'')+'" data-i="'+i+'">'+
        '<span class="no">'+(done?'✓':(i+1))+'</span>'+
        '<span><span class="nm">'+c.name+'</span>'+
          '<span class="mt">'+c.size+'×'+c.size+' · '+c.colors+'색</span>'+
          '<span class="rc" id="rc'+i+'">'+info+'</span></span>'+
        '<span class="go">'+(done?'🏆':'▶')+'</span></button>';
    }).join('');

    if(allDone) html+='<div class="alldone">오늘 '+CHALLENGES.length+'판을 모두 완료했어요 · '+
      '<b>'+wonToday()+'원</b> 적립<br><span>내일 자정에 새 챌린지 3판이 열립니다</span></div>';

    html+='<button class="btn" id="see-rank" style="width:100%;margin-top:4px">🏆 오늘의 랭킹 보기</button>';
    list.innerHTML=html;

    list.querySelectorAll('.ch-card').forEach(b=>{
      const i=+b.dataset.i, r=rec[i];
      b.onclick = (r && r.ms!=null) ? (()=>openRank(i)) : (()=>openChallenge(i));   // 완주 후엔 랭킹만
    });
    el('see-rank').onclick=()=>openRank(0);
  }

  /* ---------- 챌린지 입장 (신규 / 이어서) ---------- */
  function openChallenge(i){
    const rec=todayRec();
    if(rec[i] && rec[i].ms!=null){ openRank(i); return; }        // 재참여 차단
    stopLobbyTick();
    mode='challenge'; chIndex=i; inPlay=true;
    const c=CHALLENGES[i];

    if(!rec[i]) rec[i]={ start:Date.now(), ms:null, paid:false, paths:null };
    persist();

    el('playbar').classList.add('on');
    el('play-title').textContent='Challenge '+(i+1)+' · '+c.name;
    el('hint').textContent='나가도 시간은 계속 흐릅니다 · 완주하면 +'+PAY+'원, 재도전 없음';
    el('controls').classList.add('solo');                        // 챌린지엔 '새 판' 없음
    showView('game'); renderTabs();

    genPuzzle(c.size, c.colors, hashStr(todayKey()+'#'+i));      // 날짜+번호 시드 = 모두 같은 문제
    restoreProgress(rec[i]);
    startTimer(rec[i].start);
  }

  /* 이어서 풀기 : 그려둔 선 복원 */
  function restoreProgress(r){
    if(!r.paths || r.paths.length!==numColors) return;
    colorPaths=r.paths.map(p=>p.slice());
    cellColor.fill(-1);
    colorPaths.forEach((p,k)=>p.forEach(c=>{ if(c>=0&&c<N) cellColor[c]=k; }));
    render(); updateHud();
  }
  function saveProgress(){
    if(!inPlay) return;
    const r=todayRec()[chIndex];
    if(!r || r.ms!=null) return;
    r.paths=colorPaths.map(p=>Array.from(p));
    persist();
  }

  /* ---------- 랭킹 시트 ---------- */
  const sheet=el('sheet');
  function openRank(ci){
    el('rank-title').textContent='Challenge '+(ci+1)+' · '+CHALLENGES[ci].name;
    el('rank-sub').textContent=todayKey()+' · FASTEST TIME';
    el('rank-list').innerHTML=leaderboard(ci).map((r,i)=>{
      const g=i<3?' g'+(i+1):'';
      return '<li class="'+(r.me?'me':'')+'">'+
        '<span class="p'+g+'">'+(r.ms==null?'-':(i+1))+'</span>'+
        '<span class="nm2">'+r.name+'</span>'+
        '<span class="tm'+(r.ms==null?' non':'')+'">'+(r.ms==null?'미완료':fmt(r.ms))+'</span></li>';
    }).join('');
    const sw=el('rank-switch');
    sw.innerHTML=CHALLENGES.map((c,i)=>'<button class="'+(i===ci?'on':'')+'" data-i="'+i+'">'+(i+1)+'. '+c.name+'</button>').join('');
    sw.querySelectorAll('button').forEach(b=>b.onclick=()=>openRank(+b.dataset.i));
    sheet.classList.add('show');
  }
  sheet.onclick=e=>{ if(e.target===sheet) sheet.classList.remove('show'); };
  el('sheet-close').onclick=()=>sheet.classList.remove('show');

  /* ================= 승리 처리 ================= */
  function checkWin(){
    recomputeDone();
    for(let k=0;k<numColors;k++) if(!colorDone[k]) return;
    for(let i=0;i<N;i++) if(cellColor[i]<0) return;   // 모든 칸 채움 필요
    win();
  }
  function setOverlay(o){
    overlay.querySelector('.big').textContent=o.big;
    el('o-head').textContent=o.head;
    el('o-reward').innerHTML=o.reward;
    el('o-desc').innerHTML=o.desc;
    const L=el('o-restart'), R=el('o-next');
    L.textContent=o.left.t;  L.onclick=o.left.fn;
    R.textContent=o.right.t; R.onclick=o.right.fn;
    setTimeout(()=>overlay.classList.add('show'), 420);
  }
  function win(){ inPlay ? winChallenge() : winOnboard(); }

  function winOnboard(){
    // 각 단계 최초 클리어에만 지급 → '처음부터'로 되돌려도 재지급 없음
    const paid = (stage<=ONBOARD_LEN && stage>store.paidStage);
    if(paid){ store.paidStage=stage; store.won+=PAY; }
    if(stage+1>store.maxStage) store.maxStage=stage+1;
    const justUnlocked = (stage>=ONBOARD_LEN && !store.unlocked);
    if(justUnlocked) store.unlocked=true;
    persist(); if(paid) awardPoints(PAY,'onboarding-'+stage); updateHud(); renderTabs();

    const rw = paid ? '+'+PAY+'<span class="p">원</span>'
                    : '<span style="color:#8785BE">연습</span>';
    if(justUnlocked){
      setOverlay({ big:'온보딩 완료', head:'데일리 챌린지 해금!', reward:rw,
        desc:'이제 <b>매일 3판</b>이 열립니다.<br>완주할 때마다 <b style="color:#FFB84D">'+PAY+'원</b>씩 충전 포인트로 적립돼요.',
        left:{t:'연습 계속', fn:nextStage},
        right:{t:'챌린지 보기', fn:()=>{ overlay.classList.remove('show'); goLobby(); }} });
    } else {
      setOverlay({ big:'회로 완성', head:'STAGE '+stage+' CLEAR', reward:rw,
        desc: paid ? '충전 포인트 '+PAY+'원이 적립됐습니다.<br>누적 <b>'+store.won.toLocaleString()+'원</b>'
                   : '이미 적립한 단계라 이번엔 지급되지 않아요.',
        left:{t:'처음부터', fn:resetOnboard}, right:{t:'다음 스테이지', fn:nextStage} });
    }
  }

  function winChallenge(){
    stopTimer();
    const ms=chFinal, rec=todayRec(), r=rec[chIndex];
    r.ms=ms; r.paths=null;                       // 완주 확정 → 재도전 불가
    let paid=false;
    if(!r.paid){ r.paid=true; paid=true; store.won+=PAY; awardPoints(PAY,'challenge-'+(chIndex+1)); }
    persist(); updateHud(); renderTabs();

    const rk=myRank(chIndex), left=CHALLENGES.length-doneCount();
    setOverlay({
      big:'챌린지 완주',
      head:fmt(ms),
      reward: paid ? '+'+PAY+'<span class="p">원</span>' : rk+'<span class="p">위</span>',
      desc:'오늘 '+NAMES.length+'명 중 <b style="color:#FFB84D">'+rk+'위</b>'+
           '<br>오늘 적립 <b>'+wonToday()+'원</b> · '+
           (left ? '남은 판 <b>'+left+'</b>' : '<b style="color:#41E6E0">3판 모두 완료</b>'),
      left:{t:'목록으로', fn:()=>{ overlay.classList.remove('show'); goLobby(); }},
      right:{t:'랭킹 보기', fn:()=>{ overlay.classList.remove('show'); openRank(chIndex); }}
    });
  }

  function nextStage(){ overlay.classList.remove('show'); stage++; onboardSnap=null; const p=params(stage); genPuzzle(p.size,p.colors); }
  function resetOnboard(){ overlay.classList.remove('show'); stage=1; onboardSnap=null; const p=params(1); genPuzzle(p.size,p.colors); }
  function params(s){
    return { size:Math.min(8, 5+Math.floor((s-1)/2)),
             colors:Math.min(PAL.length, 4+Math.floor(s/2)) };
  }

  /* ===== 실제 앱 연동 지점 =====
     서버에서 반드시 재검증할 것: 하루 3판 상한, 판별 1회 지급, 완주 여부.
     클라이언트 localStorage 는 조작 가능하므로 지급 근거로 쓰면 안 됨.        */
  function awardPoints(won, src){
    // 예: window.parent.postMessage({type:'CHARGE_POINT_EARNED', won:won, src:src, date:todayKey()}, '*');
    console.log('[전류 잇기] 충전 포인트 적립 요청:', won+'원', '('+src+')');
  }

  /* ================= 버튼 배선 ================= */
  el('clear').onclick=()=>{ for(let k=0;k<numColors;k++) clearColor(k); render(); updateHud(); saveProgress(); };
  el('newp').onclick=()=>{ const p=params(stage); genPuzzle(p.size,p.colors); };   // 온보딩 전용
  el('back').onclick=goLobby;
  el('tab-onboard').onclick=goOnboard;
  el('tab-challenge').onclick=goLobby;
  window.addEventListener('pagehide', saveProgress);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveProgress(); });

  /* ================= 초기화 ================= */
  stage=Math.max(1, store.maxStage||1);
  renderTabs();
  const p0=params(stage); genPuzzle(p0.size,p0.colors);
})();
</script>
</body>
</html>
